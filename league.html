<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fab 6ヒーロー 4回戦総当たりリーグ戦</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      background-color: #f4f6f9;
      color: #333;
    }
    h1, h2 {
      text-align: center;
      color: #2c3e50;
    }
    .container {
      max-width: 950px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      padding: 20px;
      margin-bottom: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }
    th, td {
      border: 1px solid #dee2e6;
      padding: 8px 4px;
      min-width: 55px;
    }
    th {
      background-color: #e9ecef;
      font-weight: 600;
    }
    .diagonal {
      background-color: #adb5bd;
    }
    input[type="text"] {
      width: 90%;
      text-align: center;
      padding: 5px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 0.95rem;
    }
    select {
      padding: 5px;
      font-size: 0.9rem;
      border-radius: 4px;
      border: 1px solid #ced4da;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    /* 未入力のボックス強調表示スタイル */
    select.is-empty {
      background-color: #fff9db; /* 薄い黄色 */
      border-color: #fcc419;     /* やや強調した黄色枠 */
    }
    .stats {
      background-color: #f8f9fa;
      font-weight: bold;
    }
    .ranking-table th {
      background-color: #2c3e50;
      color: white;
    }
    .ranking-table tr:nth-child(even) {
      background-color: #f8f9fa;
    }
    .rank-1 { background-color: #fff3cd !important; font-weight: bold; }
    .rank-2 { background-color: #e2e3e5 !important; }
    .rank-3 { background-color: #ffe8d6 !important; }

    /* スケジュールUI用スタイル */
    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }
    .round-card {
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 10px;
      background-color: #fafafa;
    }
    .round-title {
      font-weight: bold;
      margin-bottom: 8px;
      color: #2c3e50;
      border-bottom: 2px solid #2c3e50;
      padding-bottom: 3px;
      font-size: 0.95rem;
    }
    .match-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 0.88rem;
    }
    .match-teams {
      flex: 1;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge-home {
      background-color: #007bff;
      color: white;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 0.75rem;
      margin-right: 3px;
    }

    .btn-container {
      text-align: center;
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 20px;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
    }
    .btn-save { background-color: #28a745; }
    .btn-save:hover { background-color: #218838; }
    .btn-load { background-color: #007bff; }
    .btn-load:hover { background-color: #0069d9; }
    .btn-reset { background-color: #dc3545; }
    .btn-reset:hover { background-color: #c82333; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Fab 6ヒーロー 4回戦総当たりリーグ戦</h1>

    <!-- 1. リアルタイム順位表 -->
    <div class="card">
      <h2>■ リアルタイム順位表</h2>
      <div class="table-container">
        <table class="ranking-table">
          <thead>
            <tr>
              <th style="width: 8%;">順位</th>
              <th>チーム名</th>
              <th style="width: 10%;">勝</th>
              <th style="width: 10%;">負</th>
              <th style="width: 10%;">分</th>
              <th style="width: 12%;">試合数</th>
              <th style="width: 15%;">勝率</th>
            </tr>
          </thead>
          <tbody id="rankingBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 2. 対戦スケジュール・勝敗入力 -->
    <div class="card">
      <h2>■ 対戦日程・勝敗入力 (全20節・60試合)</h2>
      <div id="scheduleContainer" class="schedule-grid"></div>
    </div>

    <!-- 3. 勝敗対戦表 (星取表) -->
    <div class="card">
      <h2>■ 対戦表 (星取表 / H:ホーム A:アウェイ)</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>チーム</th>
              <th id="th-0">チーム1</th>
              <th id="th-1">チーム2</th>
              <th id="th-2">チーム3</th>
              <th id="th-3">チーム4</th>
              <th id="th-4">チーム5</th>
              <th id="th-5">チーム6</th>
              <th class="stats">勝</th>
              <th class="stats">負</th>
              <th class="stats">分</th>
              <th class="stats">勝率</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 操作ボタン -->
    <div class="btn-container">
      <button class="btn-save" onclick="exportData()">💾 バックアップ(ファイル書き出し)</button>
      <button class="btn-load" onclick="document.getElementById('fileInput').click()">📂 復元(ファイル読み込み)</button>
      <button class="btn-reset" onclick="resetData()">🔄 データを全リセット</button>
      <input type="file" id="fileInput" style="display:none" accept=".json" onchange="importData(event)">
    </div>
  </div>
